services:
  - type: web
    name: shadowparent-c2
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r c2/requirements.txt
    startCommand: gunicorn --chdir c2 --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/sp.db
      - key: UPLOAD_DIR
        value: /tmp/sp_uploads
