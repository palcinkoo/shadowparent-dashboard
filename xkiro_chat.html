<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XKIRO Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
#chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; font-size: 15px; }
.msg.me { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #1e1e1e; color: #e0e0e0; border-bottom-left-radius: 4px; border: 1px solid #333; }
.typing { font-size: 13px; color: #888; font-style: italic; height: 20px; }
#input-area { padding: 12px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 8px; }
#text { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 24px; padding: 10px 16px; color: #fff; outline: none; font-size: 15px; }
#text::placeholder { color: #666; }
button { background: #2563eb; color: #fff; border: none; border-radius: 24px; padding: 0 20px; font-weight: 600; cursor: pointer; font-size: 14px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
#status { font-size: 12px; color: #666; text-align: center; margin: 4px 0; }
#err { color: #ef4444; font-size: 13px; margin: 0 16px; min-height: 20px; }
</style>
</head>
<body>
<div id="chat">
  <div class="msg bot">Ahoj! Som pripojený na XKIRO (qwen/qwen3.8-omni-flash:free). Napíš mi správu.</div>
</div>
<div id="status">Pripojené na https://api.xkiro.com/v1</div>
<div id="err"></div>
<div id="input-area">
  <input type="text" id="text" placeholder="Napíš správu..." autocomplete="off">
  <button id="send">Odošli</button>
</div>
<script>
const API_KEY = "sk-xt-b764c3db6eec17ca86b47697ffd83e919048a192a500877a";
const BASE = "https://api.xkiro.com/v1";
const MODEL = "qwen/qwen3.8-omni-flash:free";
const chat = document.getElementById("chat");
const input = document.getElementById("text");
const btn = document.getElementById("send");
const err = document.getElementById("err");

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function setTyping(show) {
  const existing = document.getElementById("typing");
  if (show && !existing) {
    const d = document.createElement("div");
    d.id = "typing";
    d.className = "typing bot";
    d.textContent = "Píše sa…";
    chat.appendChild(d);
  } else if (!show && existing) {
    existing.remove();
  }
  if (show) chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  err.textContent = "";
  input.value = "";
  btn.disabled = true;
  addMsg(msg, "me");
  setTyping(true);
  try {
    const r = await fetch(BASE + "/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: "user", content: msg }]
      })
    });
    setTyping(false);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    addMsg(data.choices[0].message.content, "bot");
  } catch (e) {
    setTyping(false);
    err.textContent = "Chyba: " + e.message;
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

btn.addEventListener("click", send);
input.addEventListener("keypress", e => { if (e.key === "Enter") send(); });
input.focus();
</script>
</body>
</html>
