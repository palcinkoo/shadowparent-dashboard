name: Keep the C2 awake

# The free Render instance falls asleep after 15 minutes without a request.
# The first request after the sleep answers with 502 and Cloudflare puts a
# check in front of the address - the devices then cannot talk to the
# server. This ping keeps the instance running.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the C2
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://shadowparent-c2.onrender.com/health || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "the C2 did not answer"
