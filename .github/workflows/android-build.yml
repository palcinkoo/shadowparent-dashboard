name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Python deps
        run: pip3 install --break-system-packages cryptography

      - name: Build APKs
        run: bash tools/build_apk.sh
        env:
          SP_STORE_PASS: ${{ secrets.SP_STORE_PASS }}
          SP_KEY_PASS: ${{ secrets.SP_KEY_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: shadowparent-apk
          path: build/*.apk
          if-no-files-found: error
