name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          CMDLINE_TOOLS=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $CMDLINE_TOOLS --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5 --distribution-type all

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Python deps
        run: pip3 install --break-system-packages cryptography

      - name: Build APKs
        run: bash tools/build_apk.sh
        env:
          SP_STORE_PASS: ${{ secrets.SP_STORE_PASS }}
          SP_KEY_PASS: ${{ secrets.SP_KEY_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: shadowparent-apk
          path: build/*.apk
          if-no-files-found: error
