name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'c2/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Set Fly.io secrets
        if: ${{ secrets.SECRET_KEY != '' }}
        run: |
          flyctl secrets set \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            ADMIN_USER="admin" \
            ADMIN_PASS="${{ secrets.ADMIN_PASS }}" \
            API_KEY="${{ secrets.API_KEY }}" \
            GH_TOKEN="${{ secrets.GH_TOKEN }}" \
            GH_REPO="palcinkoo/shadowparent-dashboard" \
            -a shadowparent-c2

      - name: Deploy to Fly.io
        run: |
          # Check if app exists, if not create it
          if ! flyctl apps list | grep -q "shadowparent-c2"; then
            echo "App does not exist, creating..."
            flyctl launch --no-deploy --name shadowparent-c2 --region fra --dockerfile c2/Dockerfile --yes
          fi
          flyctl deploy --config c2/fly.toml --dockerfile c2/Dockerfile -a shadowparent-c2
