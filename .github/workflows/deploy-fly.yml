name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'c2/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          version: 'latest'

      - name: Deploy to Fly.io
        run: |
          # Check if app exists, if not create it
          if ! flyctl apps list | grep -q "shadowparent-c2"; then
            echo "App does not exist, creating..."
            flyctl launch --no-deploy --name shadowparent-c2 --region fra --dockerfile c2/Dockerfile --yes
          fi
          flyctl deploy --config c2/fly.toml --dockerfile c2/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          API_KEY: ${{ secrets.API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
