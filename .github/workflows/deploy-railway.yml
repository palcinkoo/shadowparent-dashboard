name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'c2/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli --allow-scripts

      - name: Deploy to Railway
        run: railway up --detach --project ${{ secrets.RAILWAY_PROJECT_ID }}
