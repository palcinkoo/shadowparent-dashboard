name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'c2/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli --allow-scripts

      - name: Deploy to Railway
        run: |
          # Railway CLI reads RAILWAY_TOKEN from env automatically
          if ! railway status --json 2>/dev/null | grep -q "projectId"; then
            echo "No project linked, creating new project..."
            railway init --name shadowparent-c2
          fi
          railway up --detach
