name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          CMDLINE_TOOLS=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $CMDLINE_TOOLS --sdk_root=$ANDROID_HOME \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 --distribution-type all

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Python deps
        run: pip3 install --break-system-packages cryptography

      - name: Build APKs
        run: bash tools/build_apk.sh
        env:
          SP_STORE_PASS: ${{ secrets.SP_STORE_PASS }}
          SP_KEY_PASS: ${{ secrets.SP_KEY_PASS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowparent-apk
          path: build/*.apk
          retention-days: 30
          if-no-files-found: error
