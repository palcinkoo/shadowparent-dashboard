app = "shadowparent-c2"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/sp.db"
  UPLOAD_DIR = "/data/sp_uploads"

[mounts]
  source = "sp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[health_check]
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "60s"
  grace_period = "60s"
