version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowparent
      POSTGRES_USER: sp
      POSTGRES_PASSWORD: sp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp -d shadowparent"]
      interval: 5s
      timeout: 5s
      retries: 5

  c2:
    build:
      context: .
      dockerfile: c2/Dockerfile
    environment:
      PORT: "8000"
      DATABASE_URL: "postgresql://sp:sp@postgres:5432/shadowparent"
      SECRET_KEY: "dev-secret-change-in-production"
      ADMIN_USER: "admin"
      ADMIN_PASS: "admin123"
      API_KEY: "sk-xt-dev-key-change-me"
      UPLOAD_DIR: "/data/uploads"
      GH_TOKEN: ""
      GH_REPO: ""
    volumes:
      - c2data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  c2data:
